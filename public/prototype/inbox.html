<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clippings from Aruodas — Find Me Home prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="notebook.css" />
    <style>
      /* The deck: one clipping at a time. Deliberately NOT the plots list —
         a desk blotter, a single card, three decisions. */
      body { background-color: #dfe5dd; }
      .wrap { max-width: 720px; }
      .deck-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 6px 0 14px; }
      .deck-h h2 { font-size: 30px; }
      .deck-h p { margin: 4px 0 0; color: var(--ink-soft); }
      .progress { display: flex; gap: 5px; margin: 8px 0 18px; }
      .progress i { flex: 1; height: 6px; background: rgba(27, 39, 51, 0.15); border-radius: 3px; }
      .progress i.done { background: var(--pass); }
      .progress i.now { background: var(--blue); }
      .stack { position: relative; padding-bottom: 14px; }
      .under { position: absolute; left: 12px; right: 12px; top: 10px; bottom: 4px; background: #fbfaf5; box-shadow: 2px 3px 0 rgba(27, 39, 51, 0.15); transform: rotate(1.2deg); }
      .under.two { left: 22px; right: 22px; top: 18px; transform: rotate(-1.6deg); opacity: 0.7; }
      .card { position: relative; background: #fbfaf5; padding: 14px 14px 18px; box-shadow: 3px 4px 0 rgba(27, 39, 51, 0.2);
        clip-path: polygon(0 1.5%, 5% 0, 12% 1%, 22% 0, 33% 1.5%, 45% 0, 57% 1%, 70% 0, 82% 1.5%, 92% 0, 100% 1%, 100% 98.5%, 93% 100%, 81% 99%, 67% 100%, 53% 99%, 41% 100%, 27% 99%, 13% 100%, 0 99%); }
      .card img, .card .ph { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #d7dfd9; filter: grayscale(0.6); }
      .card .ph { display: grid; place-items: center; color: var(--ink-faint); }
      .card h3 { font-size: 28px; margin-top: 14px; line-height: 1.1; }
      .card .m { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; align-items: baseline; }
      .card .m b { font-family: 'Bricolage Grotesque'; font-size: 26px; }
      .card .m small { color: var(--ink-soft); font-size: 13px; display: block; }
      .card .d { margin: 12px 0 0; color: var(--ink-soft); }
      .missing { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
      .decide { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; margin-top: 20px; align-items: center; }
      .decide .btn.blue { justify-content: center; font-size: 17px; min-height: 52px; }
      .how { margin-top: 18px; font-size: 14px; color: var(--ink-soft); display: flex; gap: 10px; align-items: flex-start; }
      .how b { color: var(--ink); }
      .how .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
      .upnext { margin-top: 26px; }
      .upnext h4 { margin: 0 0 8px; font-family: 'Bricolage Grotesque'; font-size: 15px; color: var(--ink-soft); }
      .thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
      .thumbs button { border: 0; padding: 0; background: #fbfaf5; width: 72px; box-shadow: 1px 2px 0 rgba(27, 39, 51, 0.15); text-align: left; }
      .thumbs img, .thumbs .ph { width: 72px; height: 54px; object-fit: cover; display: block; filter: grayscale(1); background: #d7dfd9; }
      .thumbs span { display: block; font-size: 11px; padding: 3px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .done { text-align: center; padding: 50px 20px; }
      .done .big { width: 72px; height: 72px; border-radius: 50%; background: var(--pass); color: #fff; display: inline-grid; place-items: center; }
      .done .big svg { width: 40px; height: 40px; }
      @media (max-width: 560px) { .decide { grid-template-columns: 1fr 1fr; } .decide .btn.blue { grid-column: 1 / -1; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="crumb" href="plots.html">‹ Plots</a>
      <div id="deck"></div>
    </div>

    <script src="shared.js"></script>
    <script>
      const P = PROTO, S = P.state
      const want = new URLSearchParams(location.search).get('item')
      if (want) { const i = S.inbox.findIndex((x) => x.id === want); if (i > 0) S.inbox.unshift(S.inbox.splice(i, 1)[0]) }
      // how many were in the pile when we started sorting (for the progress bar)
      let total = Number(sessionStorage.getItem('fmh-deck-total')) || 0
      if (!total || total < S.inbox.length) { total = S.inbox.length; sessionStorage.setItem('fmh-deck-total', total) }

      function render() {
        const el = document.getElementById('deck'), n = S.inbox.length
        if (!n) { sessionStorage.removeItem('fmh-deck-total'); el.innerHTML = `<div class="panel done"><span class="big">${P.CHECK}</span><h2 style="margin-top:14px">All sorted</h2><p class="muted" style="max-width:44ch;margin:8px auto 18px">Nothing waiting from Aruodas. Next time you're on your favourites page there, click the Find Me Home bookmark to bring over a new pile.</p><a class="btn" href="plots.html">Back to plots</a></div>`; return }
        const it = S.inbox[0], done = total - n
        const missing = [it.title ? null : 'no title', it.priceEur === null ? 'no price' : null, it.areaAres === null ? 'no area' : null, it.photo === null ? 'no photo' : null].filter(Boolean)
        el.innerHTML = `
          <div class="deck-h"><div><h2>Clippings from Aruodas</h2><p>${n === 1 ? 'Last one.' : `${n} to go — one at a time.`}</p></div><span class="tag blue">${done + 1} of ${total}</span></div>
          <div class="progress" aria-hidden="true">${Array.from({ length: total }, (_, i) => `<i class="${i < done ? 'done' : i === done ? 'now' : ''}"></i>`).join('')}</div>
          <div class="stack">
            ${n > 2 ? '<div class="under two"></div>' : ''}${n > 1 ? '<div class="under"></div>' : ''}
            <article class="card">
              ${it.photo !== null ? `<img src="${P.scene(it.photo)}" alt="" />` : '<div class="ph">The advert had no photo</div>'}
              <h3>${P.escape(it.title || 'Land advert with no title')}</h3>
              <div class="m">
                <span><b>${P.eur(it.priceEur) ?? '—'}</b><small>price</small></span>
                <span><b>${P.ares(it.areaAres) ?? '—'}</b><small>area</small></span>
                <span><b>${P.perAre(it.priceEur, it.areaAres) ?? '—'}</b><small>per are</small></span>
                <span class="tag" style="align-self:center">Aruodas ${it.sourceId}</span>
              </div>
              ${it.description ? `<p class="d">${P.escape(it.description)}</p>` : ''}
              ${missing.length ? `<div class="missing"><span class="tag warn">Only the basics: ${missing.join(', ')}</span><span class="tag">No map or checks until it’s saved</span></div>` : '<div class="missing"><span class="tag">No map or checks until it’s saved</span></div>'}
              <div class="decide">
                <a class="btn blue" href="review.html?from=inbox&item=${it.id}">Open advert &amp; save it ↗</a>
                <button class="btn ghost" onclick="skip()" ${n === 1 ? 'disabled' : ''}>Skip for now</button>
                <button class="btn danger" onclick="drop()">Not interested</button>
              </div>
              <div class="how"><span class="k">?</span><span><b>What happens:</b> the advert opens on aruodas.lt. Click the Find Me Home bookmark there, check the price and area, save — and you land back here on the next clipping.</span></div>
            </article>
          </div>
          ${n > 1 ? `<div class="upnext"><h4>Up next</h4><div class="thumbs">${S.inbox.slice(1).map((x, i) => `<button onclick="bring(${i + 1})" title="${P.escape(x.title || x.sourceId)}">${x.photo !== null ? `<img src="${P.scene(x.photo)}" alt="" />` : '<div class="ph"></div>'}<span>${P.escape(x.title || x.sourceId)}</span></button>`).join('')}</div></div>` : ''}`
      }
      function skip() { S.inbox.push(S.inbox.shift()); P.save(); render() }
      function drop() { S.inbox.shift(); P.save(); render() }
      function bring(i) { S.inbox.unshift(S.inbox.splice(i, 1)[0]); P.save(); render() }
      P.mount('inbox')
      render()
    </script>
  </body>
</html>
