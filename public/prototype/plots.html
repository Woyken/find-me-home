<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plots — Find Me Home prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="notebook.css" />
    <style>
      .legend { display: flex; flex-wrap: wrap; gap: 10px 22px; color: var(--ink-soft); font-size: 14px; padding: 10px 0 18px; border-top: 2px solid var(--ink); align-items: center; }
      .legend b { color: var(--ink); }
      .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 6px 0 14px; }
      .sort { display: flex; gap: 6px; flex-wrap: wrap; }
      .sort button { border-radius: 999px; padding: 6px 14px; border: 2px solid var(--line); background: var(--card); font-weight: 700; font-size: 14px; min-height: 36px; }
      .sort button[aria-pressed='true'] { border-color: var(--ink); background: var(--ink); color: #fff; }
      .list { display: grid; gap: 14px; }
      .row { display: grid; grid-template-columns: 120px 1fr auto; gap: 18px; align-items: start; }
      .title { font-size: 24px; font-weight: 600; line-height: 1.15; text-decoration: none; font-family: 'Bricolage Grotesque'; }
      .title:hover { text-decoration: underline; text-decoration-color: var(--blue); }
      .place { color: var(--ink-soft); margin-top: 2px; }
      .figs { display: flex; flex-wrap: wrap; gap: 6px 26px; margin-top: 12px; }
      .fig .v { font-family: 'Bricolage Grotesque'; font-size: 24px; font-weight: 700; line-height: 1; }
      .fig .l { font-size: 13px; color: var(--ink-soft); }
      .checks { display: flex; flex-wrap: wrap; align-items: center; margin-top: 12px; row-gap: 6px; }
      .marks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 10px; }
      .side { display: grid; gap: 10px; justify-items: end; text-align: right; }
      .plots, .updated { font-size: 13px; color: var(--ink-soft); }

      /* the pocket: loose clippings tucked inside the notebook cover */
      .pocket { position: relative; margin: 6px 0 22px; padding: 16px 18px 18px; background: #e4e9e2; border: 0; border-top: 2px solid var(--ink); border-bottom: 2px dashed var(--ink-faint);
        background-image: repeating-linear-gradient(-45deg, transparent 0 9px, rgba(27, 39, 51, 0.045) 9px 10px); }
      .pocket-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
      .pocket-h h2 { font-size: 22px; }
      .pocket-h p { margin: 0; color: var(--ink-soft); font-size: 15px; }
      .clips { display: flex; gap: 14px; overflow-x: auto; padding: 16px 6px 8px; scroll-snap-type: x proximity; }
      .clip { flex: none; width: 190px; scroll-snap-align: start; text-decoration: none; background: #fbfaf5; padding: 8px 8px 10px; transform: rotate(var(--r, 0deg)); box-shadow: 2px 3px 0 rgba(27, 39, 51, 0.18); position: relative;
        clip-path: polygon(0 3%, 6% 0, 14% 2%, 25% 0, 36% 3%, 48% 0, 60% 2%, 72% 0, 85% 3%, 94% 0, 100% 2%, 100% 97%, 92% 100%, 80% 98%, 66% 100%, 52% 98%, 40% 100%, 26% 98%, 12% 100%, 0 98%); }
      .clip:nth-child(odd) { --r: -1.4deg; } .clip:nth-child(even) { --r: 1.1deg; } .clip:nth-child(3n) { --r: 0.4deg; }
      .clip:hover { transform: rotate(0) translateY(-2px); }
      .clip img, .clip .ph { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; filter: grayscale(1) contrast(0.95); background: #d7dfd9; }
      .clip .ph { display: grid; place-items: center; color: var(--ink-faint); font-size: 12px; }
      .clip .t { font-family: 'Bricolage Grotesque'; font-weight: 600; font-size: 15px; line-height: 1.2; margin-top: 8px; color: var(--ink); }
      .clip .m { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
      .clip .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.9); font-size: 15px; line-height: 1; }
      .clip.more { display: grid; place-items: center; text-align: center; background: transparent; box-shadow: none; clip-path: none; border: 2px dashed var(--ink-faint); color: var(--blue); font-weight: 700; }
      .captured { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; margin-top: 8px; color: var(--ink-soft); }
      .captured b { color: var(--ink); }
      @media (max-width: 640px) {
        .row { grid-template-columns: 84px 1fr; }
        .side { grid-column: 1 / -1; justify-items: start; text-align: left; }
        .title { font-size: 21px; }
        .fig .v { font-size: 21px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="header"></div>

      <section class="pocket" id="pocket" aria-label="Clippings from Aruodas"></section>

      <div class="legend">
        <span><b>Each plot:</b> a map of where it is, its 13 automatic checks, and whether we're going to see it.</span>
        <span><span class="strip" style="grid-template-columns:repeat(4,11px)"><i class="pass"></i><i class="warning"></i><i class="fail"></i><i></i></span> &nbsp;passed · look · problem · not checked</span>
      </div>

      <div class="tools">
        <div class="sort" role="group" aria-label="Sort plots">
          <button aria-pressed="true" onclick="sortBy('new', this)">Latest change</button>
          <button aria-pressed="false" onclick="sortBy('cheap', this)">Cheapest</button>
          <button aria-pressed="false" onclick="sortBy('big', this)">Biggest</button>
          <button aria-pressed="false" onclick="sortBy('clean', this)">Fewest problems</button>
        </div>
        <span class="small muted" id="count"></span>
      </div>

      <section class="list" id="list" aria-label="Saved plots"></section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="shared.js"></script>
    <script>
      const P = PROTO, S = P.state
      let sort = 'new'
      const locNote = { exact: 'exact shape', approx: 'roughly here', problem: 'location failed', unknown: 'no location yet' }
      const sorted = () => {
        const a = [...S.listings]
        const price = (l) => P.primary(l).priceEur ?? 1e12
        if (sort === 'cheap') a.sort((x, y) => price(x) - price(y))
        else if (sort === 'big') a.sort((x, y) => (P.primary(y).areaAres ?? 0) - (P.primary(x).areaAres ?? 0))
        else if (sort === 'clean') a.sort((x, y) => { const s = (l) => { const c = P.summary(P.primary(l).checks); return c.fail * 100 + c.warning + (c.pass ? 0 : 50) }; return s(x) - s(y) })
        else a.sort((x, y) => y.updatedAt - x.updatedAt)
        return a
      }
      const captured = new URLSearchParams(location.search).has('captured')
      function renderPocket() {
        const el = document.getElementById('pocket'), n = S.inbox.length
        if (!n) { el.classList.add('hidden'); return }
        el.classList.remove('hidden')
        const shown = S.inbox.slice(0, 4)
        el.innerHTML = `<div class="pocket-h"><div><h2>${n} clipping${n === 1 ? '' : 's'} from Aruodas</h2><p>Favourites you brought over. They're not plots yet — open one and click the bookmark to glue it in.</p>
          ${captured ? `<div class="captured"><span><b>2</b> new</span><span><b>1</b> refreshed</span><span><b>3</b> already saved</span><span><b>1</b> skipped, not land</span><span><b>1</b> skipped, sold</span></div>` : ''}</div>
          <a class="btn blue" href="inbox.html">Sort them one by one</a></div>
          <div class="clips">${shown.map((it) => `<a class="clip" href="inbox.html?item=${it.id}"><button class="x" aria-label="Not interested" onclick="event.preventDefault();dropClip('${it.id}')">×</button>${it.photo !== null ? `<img src="${P.scene(it.photo)}" alt="" />` : '<div class="ph">no photo</div>'}<div class="t">${P.escape(it.title || 'Land advert ' + it.sourceId)}</div><div class="m">${[P.eur(it.priceEur), P.ares(it.areaAres)].filter(Boolean).join(' · ') || 'no details yet'}</div></a>`).join('')}
          ${n > shown.length ? `<a class="clip more" href="inbox.html">+${n - shown.length} more</a>` : ''}</div>`
      }
      function dropClip(id) { S.inbox.splice(S.inbox.findIndex((x) => x.id === id), 1); P.save(); P.refreshHeader('plots'); renderPocket() }
      function render() {
        renderPocket()
        document.getElementById('count').textContent = `${S.listings.length} plots · ${S.plan.length} going to see`
        document.getElementById('list').innerHTML = sorted().map((l) => {
          const a = P.primary(l), going = P.planned(l.id), loc = P.locState(a)
          const hasMap = P.located(l).length > 0
          return `<article class="panel row ${going ? 'going' : ''}">
            <div>
              <a href="plot.html?id=${l.id}" aria-label="Open ${P.escape(l.title)}">
                ${hasMap ? `<div class="mini" id="map-${l.id}"></div>` : `<div class="mini none">${loc === 'problem' ? '<span class="display" style="font-size:40px;color:var(--fail)">!</span>' : P.PIN}</div>`}
              </a>
              <small class="mini-cap">${locNote[loc]}</small>
            </div>
            <div>
              <a class="title" href="plot.html?id=${l.id}">${P.escape(l.title)}</a>
              <div class="place">${l.address ? P.escape(l.address) : 'Location not recorded yet'}</div>
              <div class="figs">
                <div class="fig"><div class="v">${P.eur(a.priceEur) ?? '—'}</div><div class="l">price</div></div>
                <div class="fig"><div class="v">${P.ares(a.areaAres) ?? '—'}</div><div class="l">area</div></div>
                <div class="fig"><div class="v">${P.perAre(a.priceEur, a.areaAres) ?? '—'}</div><div class="l">per are</div></div>
              </div>
              <div class="checks">${P.strip(a.checks)}${P.stripSum(a.checks)}</div>
              <div class="marks">
                ${l.visitedAt ? `<span class="tag pass">${P.CHECK.replace('<svg', '<svg width="14" height="14"')} visited ${P.dateShort(l.visitedAt)}</span>` : ''}
                ${l.areas.length > 1 ? `<span class="tag">${l.areas.length} marked areas</span>` : ''}
                ${l.photos.length ? '' : '<span class="tag">no photos</span>'}
              </div>
            </div>
            <div class="side">
              <button class="go" aria-pressed="${going}" onclick="toggle('${l.id}')">${P.FLAG}${going ? 'Going to see' : 'Go see it'}</button>
              <span class="updated">changed ${P.ago(l.updatedAt)}</span>
            </div>
          </article>`
        }).join('')
        S.listings.forEach((l) => { const el = document.getElementById('map-' + l.id); if (el) P.miniMap(el, l, P.planned(l.id) ? '#e8641b' : '#2a5d9f') })
      }
      function toggle(id) { P.togglePlan(id); P.refreshHeader('plots'); render() }
      function sortBy(k, btn) { sort = k; document.querySelectorAll('.sort button').forEach((b) => b.setAttribute('aria-pressed', b === btn)); render() }
      P.mount('plots')
      render()
    </script>
  </body>
</html>
