<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Going to see — Find Me Home prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="notebook.css" />
    <style>
      .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; border-top: 2px solid var(--ink); padding-top: 16px; margin-bottom: 16px; }
      .head h2 { font-size: 34px; }
      .head p { margin: 4px 0 0; color: var(--ink-soft); }
      .stops { display: grid; gap: 12px; }
      .stop { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; }
      .stop .num { width: 44px; height: 44px; border-radius: 50%; background: var(--stake); color: #fff; display: grid; place-items: center; font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 20px; }
      .stop .t { font-family: 'Bricolage Grotesque'; font-size: 21px; font-weight: 600; text-decoration: none; }
      .stop .t:hover { text-decoration: underline; }
      .stop .p { color: var(--ink-soft); font-size: 15px; }
      .stop .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 14px; }
      .ctrl { display: flex; gap: 6px; }
      .ctrl button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; font-weight: 700; display: grid; place-items: center; }
      .ctrl button svg { width: 18px; height: 18px; }
      .ctrl button.x { border-color: var(--fail); color: var(--fail); }
      .bigmap { height: 440px; margin-bottom: 14px; }
      .compact { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
      .compact .stop { grid-template-columns: 36px 1fr; padding: 10px 12px; }
      .compact .num { width: 36px; height: 36px; font-size: 16px; }
      .compact .t { font-size: 17px; }
      @media (max-width: 640px) { .stop { grid-template-columns: 40px 1fr; } .stop .ctrl { grid-column: 1 / -1; justify-content: flex-end; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="header"></div>
      <div class="head">
        <div><h2>Going to see</h2><p id="sub"></p></div>
        <div class="rowline" style="margin:0">
          <a class="btn ghost" id="route" target="_blank" rel="noreferrer">Open route in Google Maps</a>
          <div class="seg" role="group" aria-label="View"><button aria-pressed="true" onclick="setView('list', this)">List</button><button aria-pressed="false" onclick="setView('map', this)">Map</button></div>
        </div>
      </div>
      <div id="content"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="shared.js"></script>
    <script>
      const P = PROTO, S = P.state
      let view = 'list'
      const UP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`
      const DOWN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>`
      const X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`
      const stops = () => S.plan.map(P.listing).filter(Boolean)
      const stopHtml = (l, i, n, compact) => {
        const a = P.primary(l)
        return `<article class="panel stop going">
          <span class="num">${i + 1}</span>
          <div>
            <a class="t" href="plot.html?id=${l.id}">${P.escape(l.title)}</a>
            <div class="p">${l.address ? P.escape(l.address) : 'Location not recorded yet'}</div>
            ${compact ? '' : `<div class="meta"><b>${P.eur(a.priceEur) ?? '—'}</b><span>${P.ares(a.areaAres) ?? '—'}</span>${P.strip(a.checks)}${l.visitedAt ? `<span class="tag pass">visited ${P.dateShort(l.visitedAt)}</span>` : ''}${a.resolved.lat === null ? '<span class="tag warn">not on the map</span>' : ''}</div>`}
          </div>
          <div class="ctrl">
            <button aria-label="Move up" ${i === 0 ? 'disabled' : ''} onclick="move(${i},-1)">${UP}</button>
            <button aria-label="Move down" ${i === n - 1 ? 'disabled' : ''} onclick="move(${i},1)">${DOWN}</button>
            <button class="x" aria-label="Remove from the list" onclick="drop('${l.id}')">${X}</button>
          </div>
        </article>`
      }
      function render() {
        const list = stops()
        document.getElementById('sub').textContent = list.length ? `${list.length} stop${list.length === 1 ? '' : 's'}, in the order you'll drive. Use the arrows to reorder.` : 'Nothing planned yet.'
        const coords = list.map(P.primary).filter((a) => a.resolved.lat !== null).map((a) => `${a.resolved.lat},${a.resolved.lng}`)
        const route = document.getElementById('route')
        route.classList.toggle('hidden', coords.length < 1)
        route.href = `https://www.google.com/maps/dir/?api=1&destination=${coords[coords.length - 1]}${coords.length > 1 ? `&waypoints=${coords.slice(0, -1).join('|')}` : ''}`
        route.innerHTML = `${P.PIN} Open route in Google Maps`
        const c = document.getElementById('content')
        if (!list.length) { c.innerHTML = `<div class="panel empty"><h2>No visits planned yet</h2><p>On the plots page, press "Go see it" on the ones worth a drive. They'll line up here.</p><a class="btn stake" href="plots.html">${P.FLAG} Pick plots to see</a></div>`; return }
        if (view === 'list') { c.innerHTML = `<div class="stops">${list.map((l, i) => stopHtml(l, i, list.length, false)).join('')}</div>`; return }
        c.innerHTML = `<div class="bigmap" id="bigmap"></div><div class="compact">${list.map((l, i) => stopHtml(l, i, list.length, true)).join('')}</div>`
        const items = list.flatMap((l, i) => { const a = P.primary(l); return a.resolved.lat === null ? [] : [{ id: l.id, area: a, label: String(i + 1), stop: true, color: '#e8641b' }] })
        if (items.length) P.bigMap(document.getElementById('bigmap'), items, { onSelect: (id) => (location.href = 'plot.html?id=' + id) })
        else document.getElementById('bigmap').innerHTML = '<p class="muted" style="padding:20px">None of these plots is on the map yet.</p>'
      }
      function move(i, d) { const j = i + d; if (j < 0 || j >= S.plan.length) return; [S.plan[i], S.plan[j]] = [S.plan[j], S.plan[i]]; P.save(); render() }
      function drop(id) { P.togglePlan(id); P.refreshHeader('trip'); render() }
      function setView(v, btn) { view = v; document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', b === btn)); render() }
      P.mount('trip')
      render()
    </script>
  </body>
</html>
