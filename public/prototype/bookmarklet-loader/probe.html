<!doctype html>
<!-- PROTOTYPE - throwaway. Loaded in an iframe / popup / embed / object by the bookmarklet-loader probe. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Find Me Home probe</title>
  </head>
  <body>
    <p>
      Find Me Home loader probe. This page only posts a message to its
      opener/parent.
    </p>
    <script>
      (function () {
        var via = new URLSearchParams(location.search).get('via') || 'unknown';
        var msg = {
          type: 'fmh-probe',
          via: via,
          from: 'probe.html',
          loadedAt: Date.now(),
        };
        var targets = [];
        if (window.opener) targets.push(window.opener);
        if (window.parent && window.parent !== window)
          targets.push(window.parent);
        targets.forEach(function (t) {
          try {
            t.postMessage(msg, '*');
          } catch (_) {}
        });
        if (window.opener) {
          setTimeout(function () {
            window.close();
          }, 300);
        }
      })();
    </script>
  </body>
</html>
