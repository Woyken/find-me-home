<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>First run — Find Me Home prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="notebook.css" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; }
      .start { max-width: 760px; width: calc(100% - 32px); padding: 34px; margin: 24px 0 120px; }
      .start h1 { font-size: clamp(36px, 7vw, 64px); line-height: 1; max-width: 14ch; }
      .start .lead { color: var(--ink-soft); margin: 16px 0 0; max-width: 52ch; font-size: 18px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--blue); margin-bottom: 18px; }
      .brand svg { width: 28px; height: 28px; }
      .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 28px; }
      .choice { padding: 18px; }
      .choice h2 { font-size: 22px; }
      .choice p { color: var(--ink-soft); font-size: 15px; margin: 6px 0 14px; }
      .states { margin-top: 26px; padding-top: 14px; border-top: 1.5px dashed var(--line); font-size: 14px; color: var(--ink-soft); }
      .states a { margin-right: 12px; }
      .center { text-align: center; padding: 40px 20px; }
      .center .dot { display: inline-block; width: 14px; height: 14px; }
      @media (max-width: 600px) { .choices { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="page"></div>
    <script src="shared.js"></script>
    <script>
      const P = PROTO
      const state = new URLSearchParams(location.search).get('state') || 'start'
      const HOUSE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>`
      const page = document.getElementById('page')
      if (state === 'waiting') page.innerHTML = `<div class="panel start center"><span class="dot syncing"></span><h2 style="margin-top:14px">Joining the search…</h2><p class="muted">Waiting for another device in this search to come online so we can copy the plots. Keep this page open.</p><a class="linkbtn" href="start.html">Cancel</a></div>`
      else if (state === 'syncing') page.innerHTML = `<div class="panel start center"><span class="dot syncing"></span><h2 style="margin-top:14px">Copying plots…</h2><p class="muted">Almost there.</p></div>`
      else if (state === 'error') page.innerHTML = `<div class="panel start center danger"><h2>The saved plots couldn't be opened</h2><p role="alert" style="margin-top:8px">This browser blocked the storage this app uses (often private/incognito mode). Open Find Me Home in a normal window, or on another device in the search.</p><a class="btn" href="start.html">Try again</a></div>`
      else page.innerHTML = `
        <main class="panel start">
          <div class="brand">${HOUSE} Find Me Home</div>
          <h1>Find land together.</h1>
          <p class="lead">Save plots from Aruodas, see them on a map, let the app check the boring things — bus stops, electricity, legal limits — and plan which ones to drive out and see. Everything stays on your own devices and syncs between them.</p>
          <div class="choices">
            <div class="panel choice">
              <h2>Start a new search</h2>
              <p>For you, or you and a partner. You can invite others afterwards.</p>
              <button class="btn" onclick="this.textContent='Creating…';setTimeout(()=>location.href='plots.html',600)">Start a search</button>
            </div>
            <div class="panel choice soft">
              <h2>Join someone's search</h2>
              <p>Ask them for the invitation link (in <i>Our search settings</i>) and open it on this device — or paste it here.</p>
              <div class="rowline" style="margin:0"><input class="plain" style="margin:0;flex:1;width:auto" placeholder="https://woyken.github.io/find-me-home/#household=…" aria-label="Invitation link" /><button class="btn ghost" onclick="PROTO.toast('Opening invitation (prototype)');setTimeout(()=>location.href='start.html?state=waiting',700)">Join</button></div>
            </div>
          </div>
          <div class="states">Other first-run states: <a href="start.html?state=waiting">waiting for a device</a><a href="start.html?state=syncing">copying</a><a href="start.html?state=error">storage blocked</a></div>
        </main>`
      P.mount('start')
    </script>
  </body>
</html>
