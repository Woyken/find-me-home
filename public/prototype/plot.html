<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plot — Find Me Home prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="notebook.css" />
    <style>
      .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); margin-bottom: 22px; }
      .head h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.05; max-width: 22ch; }
      .head .place { color: var(--ink-soft); font-size: 18px; margin-top: 6px; }
      .head .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .cols { display: grid; grid-template-columns: 1fr 300px; gap: 26px; align-items: start; }
      .section-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 26px 0 12px; }
      .area { margin-top: 16px; }
      .area.selected { border-color: var(--stake); box-shadow: 4px 4px 0 #f5cdb3; }
      .area-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .area-h h3 { font-size: 22px; }
      .area-h .num { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; font-family: 'Bricolage Grotesque'; font-weight: 700; margin-right: 8px; vertical-align: middle; }
      .selected .area-h .num { background: var(--stake); }
      .sub-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .sub-h h4 { margin: 0; font-family: 'Bricolage Grotesque'; font-size: 17px; font-weight: 700; }
      .block { margin-top: 14px; padding: 14px; }
      .checklist { display: grid; gap: 6px; margin-top: 12px; }
      .check { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 12px; background: #fff; border: 1.5px solid var(--line); font-size: 15px; }
      .check b { font-weight: 700; }
      .check .v { grid-column: 1; }
      .check .d { grid-column: 1 / -1; font-size: 13px; color: var(--ink-soft); }
      .check .tag { grid-row: 1 / span 2; align-self: start; }
      .check.fail { border-color: #f0bdb4; } .check.warning { border-color: #efd28f; }
      .rating { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
      .status { font-size: 14px; color: var(--pass); font-weight: 700; }
      .gallery img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; border: 1.5px solid var(--ink); }
      .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
      .thumbs img { aspect-ratio: 1; border: 1.5px solid var(--line); cursor: pointer; }
      .thumbs img.on { border-color: var(--ink); }
      .util { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
      .aside-p { margin: 10px 0 0; font-size: 15px; }
      @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } aside { order: -1; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="crumb" href="plots.html">‹ All plots</a>
      <div id="page"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="shared.js"></script>
    <script>
      const P = PROTO, S = P.state
      const id = new URLSearchParams(location.search).get('id') || 'l1'
      const l = P.listing(id)
      let selected = null, photoIx = 0, big = null
      const locNote = (a) => ({ resolved: a.resolved.precision === 'exact' ? 'Exact shape from the land registry' : 'Roughly here — the hint was not precise enough for the exact shape',
        missing: 'Waiting to look up the location hint…', 'no-result': 'Nothing found for this hint. Check the location hint below and try again.', unavailable: 'The location service could not be reached. Try again when online.' })[a.resolved.state]
      const dirUrl = (a) => { const d = a.resolved.lat !== null ? `${a.resolved.lat},${a.resolved.lng}` : a.clue.lat !== null ? `${a.clue.lat},${a.clue.lng}` : a.clue.address; return d ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(d)}` : null }
      const stars = (a, key) => `<span class="stars" role="radiogroup">${[1, 2, 3, 4, 5].map((n) => `<button class="${a.ratings[key] >= n ? 'on' : ''}" aria-label="${n} of 5" onclick="rate('${a.id}','${key}',${n})">★</button>`).join('')}</span>`
      const utilWord = { connected: 'connected', nearby: 'nearby', city: 'city', none: 'none', well: 'well' }

      const areaHtml = (a, i) => {
        const c = P.summary(a.checks), hasChecks = c.pass + c.warning + c.fail > 0
        const kind = a.clue.kind
        return `<article class="panel area ${a.id === selected ? 'selected' : ''}" id="area-${a.id}">
          <div class="area-h">
            <h3><span class="num">${i + 1}</span>${P.escape(a.name || (l.areas.length > 1 ? `Marked area ${i + 1}` : 'The plot'))}</h3>
            <div class="rowline" style="margin:0">${dirUrl(a) ? `<a class="btn ghost sm" target="_blank" rel="noreferrer" href="${dirUrl(a)}">${P.PIN} Directions</a>` : ''}${a.resolved.lat !== null ? `<button class="btn ghost sm" onclick="showOnMap('${a.id}')">Show on map</button>` : ''}</div>
          </div>

          <section class="panel blue block">
            <div class="sub-h"><h4>Where it is</h4>${a.resolved.state !== 'resolved' || (a.clue.lat !== null && !a.resolved.boundary) ? `<button class="btn blue sm" onclick="retryLocation('${a.id}')">Look up again</button>` : ''}</div>
            <p class="small" style="margin:6px 0 0">${locNote(a)}</p>
            ${a.resolved.lat !== null || a.resolved.address ? `<dl class="kv">
              <dt>Address</dt><dd>${a.resolved.address ?? 'Unavailable'}</dd>
              <dt>Coordinates</dt><dd>${a.resolved.lat !== null ? `${a.resolved.lat}, ${a.resolved.lng}` : 'Unavailable'}</dd>
              <dt>Unique parcel no.</dt><dd>${a.resolved.parcel ?? 'Not found'}</dd>
              <dt>Cadastral no.</dt><dd>${a.resolved.cadastral ?? 'Not found'}</dd>
              <dt>Registry data</dt><dd>${a.resolved.dataset ?? 'Not loaded'}</dd>
            </dl>` : ''}
            ${a.resolved.diagnostic ? `<details style="margin-top:10px"><summary>What went wrong</summary><pre>${P.escape(a.resolved.diagnostic)}</pre></details>` : ''}
          </section>

          <section class="panel soft block">
            <div class="sub-h"><h4>Automatic checks</h4><button class="btn ghost sm" onclick="runChecks('${a.id}')">${hasChecks ? 'Check again' : 'Run checks'}</button></div>
            <div style="margin-top:10px">${P.strip(a.checks, true)}</div>
            <div class="small" style="margin-top:6px">${P.stripSum(a.checks).replace('margin-left', 'margin')}</div>
            <div class="checklist">${a.checks.map((x) => `<div class="check ${x.status}"><b>${x.label}</b><span class="tag ${x.status === 'warning' ? 'warn' : x.status === 'unknown' ? '' : x.status}">${{ pass: 'fine', warning: 'look', fail: 'problem', unknown: 'not checked' }[x.status]}</span><span class="v">${P.escape(x.value)}</span>${x.detail ? `<span class="d">${P.escape(x.detail)}</span>` : ''}</div>`).join('')}</div>
            <p class="small muted" style="margin:10px 0 0">Each check is independent advice — there is no overall score.</p>
          </section>

          <section class="block" style="padding:0 0 4px">
            <div class="grid2">
              <label class="f">Name for this area<input id="f-name-${a.id}" value="${P.escape(a.name ?? '')}" placeholder="e.g. Whole plot" /></label>
              <label class="f">Price (€)<input id="f-price-${a.id}" inputmode="decimal" value="${a.priceEur ?? ''}" /></label>
              <label class="f">Area (ares)<input id="f-area-${a.id}" inputmode="decimal" value="${a.areaAres ?? ''}" /></label>
              <label class="f">Land purpose<input id="f-purpose-${a.id}" value="${P.escape(a.purpose ?? '')}" /></label>
            </div>
            <label class="f" style="margin-top:14px">Our notes<textarea id="f-notes-${a.id}">${P.escape(a.notes ?? '')}</textarea></label>
          </section>

          <section class="panel soft block">
            <div class="sub-h"><h4>Location hint</h4><span class="small muted">What we use to find it on the map</span></div>
            <label class="f" style="margin-top:8px">Find it by
              <select id="f-kind-${a.id}" onchange="kind('${a.id}', this.value)">
                <option value="parcel" ${kind === 'parcel' ? 'selected' : ''}>Unique parcel number (most exact)</option>
                <option value="coordinates" ${kind === 'coordinates' ? 'selected' : ''}>Coordinates</option>
                <option value="address" ${kind === 'address' ? 'selected' : ''}>Address</option>
              </select></label>
            <div id="hint-${a.id}" style="margin-top:10px">${hintFields(a, kind)}</div>
          </section>

          <section class="panel soft block">
            <div class="sub-h"><h4>Our ratings</h4><span class="small muted">After you've been there</span></div>
            <div class="rating"><span>Road & access</span>${stars(a, 'road')}</div>
            <div class="rating"><span>Feel of the area</span>${stars(a, 'feeling')}</div>
            <div class="rating" style="border:0"><span>View</span>${stars(a, 'view')}</div>
          </section>

          <div class="rowline" style="margin-top:16px"><button class="btn" onclick="saveArea('${a.id}')">Save this area</button><span class="status" id="status-${a.id}"></span></div>
        </article>`
      }
      function hintFields(a, kind) {
        if (kind === 'parcel') return `<label class="f">Unique parcel number<input id="f-parcel-${a.id}" value="${P.escape(a.clue.parcel)}" placeholder="4400-1234-5678" /></label><p class="small muted" style="margin:6px 0 0">Found on the advert or in the Registrų centras extract.</p>`
        if (kind === 'coordinates') return `<div class="grid2"><label class="f">Latitude<input id="f-lat-${a.id}" value="${a.clue.lat ?? ''}" /></label><label class="f">Longitude<input id="f-lng-${a.id}" value="${a.clue.lng ?? ''}" /></label><label class="f">How exact<select id="f-prec-${a.id}"><option value="exact" ${a.clue.precision === 'exact' ? 'selected' : ''}>Exactly on the plot</option><option value="approx" ${a.clue.precision === 'approx' ? 'selected' : ''}>Roughly there</option></select></label></div>`
        return `<label class="f">Address<input id="f-addr-${a.id}" value="${P.escape(a.clue.address || l.address || '')}" /></label>`
      }

      function render() {
        if (!l) { document.getElementById('page').innerHTML = `<div class="panel empty"><h2>This plot isn't here any more</h2><p>It may have been removed on another device.</p><a class="btn" href="plots.html">Back to plots</a></div>`; return }
        const going = P.planned(l.id), a0 = P.primary(l), locatedAreas = P.located(l)
        document.getElementById('page').innerHTML = `
          <header class="head">
            <div>
              <h1>${P.escape(l.title)}</h1>
              <div class="place">${l.address ? P.escape(l.address) : 'Location not recorded yet'}</div>
              <div class="tags">
                <a class="tag blue" href="${l.url}" target="_blank" rel="noreferrer">Aruodas ${l.sourceId} ↗</a>
                ${l.visitedAt ? `<span class="tag pass">visited ${P.dateShort(l.visitedAt)}</span>` : '<span class="tag">not visited yet</span>'}
                <span class="tag">changed ${P.ago(l.updatedAt)}</span>
              </div>
            </div>
            <button class="go" aria-pressed="${going}" onclick="toggle()">${P.FLAG}${going ? 'Going to see' : 'Go see it'}</button>
          </header>
          <div class="cols">
            <main>
              ${locatedAreas.length ? `<div class="bigmap" id="bigmap"><div class="overlay"><button class="btn sm" onclick="PROTO.toast('Locating you… (prototype)')">Where am I</button><button class="btn sm" onclick="fullscreen()">Full screen</button></div></div>` : `<div class="panel blue"><b>Not on the map yet.</b> <span class="muted">Add a location hint to one of the marked areas below and we'll look it up.</span></div>`}
              <div class="section-h">
                <div><h2>Marked areas</h2><p class="small muted" style="margin:2px 0 0">${l.areas.length === 1 ? 'The whole plot as advertised. Mark another area if you would only buy part of it, or want to compare a split.' : `${l.areas.length} ways of buying this plot, compared side by side.`}</p></div>
                <button class="btn stake ghost" onclick="addArea()">+ Mark another area</button>
              </div>
              ${l.areas.map(areaHtml).join('')}
            </main>
            <aside>
              ${l.photos.length ? `<div class="gallery"><img id="photo" src="${P.scene(l.photos[photoIx])}" alt="" />${l.photos.length > 1 ? `<div class="thumbs">${l.photos.map((p, i) => `<img class="${i === photoIx ? 'on' : ''}" src="${P.scene(p)}" alt="" onclick="photoIx=${i};render()" />`).join('')}</div>` : ''}</div>` : `<div class="panel soft muted small">No photos came with the advert.</div>`}
              <div class="panel soft" style="margin-top:14px">
                <p class="aside-p" style="margin:0">${l.description ? P.escape(l.description) : '<span class="muted">No description came with the advert.</span>'}</p>
                ${Object.keys(l.utilities).length ? `<div class="util">${Object.entries(l.utilities).map(([k, v]) => `<span class="tag ${v === 'none' ? 'warn' : 'pass'}">${k}: ${utilWord[v] || v}</span>`).join('')}</div>` : ''}
                <p class="aside-p"><b>Last visit:</b> ${P.dateLong(l.visitedAt)}</p>
                <a class="linkbtn" style="display:inline-block;margin-top:8px" href="${l.url}" target="_blank" rel="noreferrer">Open the original advert ↗</a>
              </div>
              <div class="panel stake" style="margin-top:14px">
                <h3>We went to see it</h3>
                <p class="small" style="margin:6px 0 12px">Records today's visit and takes it off the "going to see" list. Your notes and ratings stay.</p>
                <button class="btn stake" style="width:100%;justify-content:center" onclick="visited()">${P.CHECK} Mark as visited</button>
              </div>
              <div class="panel danger" style="margin-top:14px">
                <h3>Remove this plot</h3>
                <p class="small" style="margin:6px 0 12px">Removes it and its marked areas for everyone in the search. Saving the same advert again brings it back with your notes.</p>
                <button class="btn danger" style="width:100%;justify-content:center" onclick="remove()">Remove plot</button>
              </div>
            </aside>
          </div>`
        const mapEl = document.getElementById('bigmap')
        if (mapEl) {
          big = P.bigMap(mapEl, locatedAreas.map((a, i) => ({ id: a.id, area: a, label: a.name || `Area ${l.areas.indexOf(a) + 1}` })), { selectedId: selected, onSelect: (aid) => { selected = aid; render(); document.getElementById('area-' + aid)?.scrollIntoView({ behavior: 'smooth', block: 'start' }) } })
        }
      }
      // actions
      const touch = () => { l.updatedAt = Date.now(); S.household.lastChange = Date.now(); P.save() }
      function toggle() { P.togglePlan(l.id); render() }
      function showOnMap(aid) { selected = aid; render(); document.getElementById('bigmap')?.scrollIntoView({ behavior: 'smooth' }); big?.focus(aid) }
      function fullscreen() { const el = document.getElementById('bigmap'); if (document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen?.() }
      function addArea() { const n = l.areas.length + 1; l.areas.push({ id: 'a' + Date.now(), name: null, priceEur: null, areaAres: null, purpose: null, notes: null, clue: { kind: 'address', parcel: '', lat: null, lng: null, precision: 'approx', address: l.address || '' }, resolved: { state: 'missing', lat: null, lng: null, address: null, parcel: null, cadastral: null, boundary: null, precision: null, dataset: null, diagnostic: null }, ratings: { road: null, feeling: null, view: null }, checks: P.CHECKS.map(([key, label]) => ({ key, label, status: 'unknown', value: 'Not checked', detail: null })) }); selected = l.areas[n - 1].id; touch(); render(); document.getElementById('area-' + selected)?.scrollIntoView({ behavior: 'smooth' }) }
      function rate(aid, key, n) { const a = l.areas.find((x) => x.id === aid); a.ratings[key] = a.ratings[key] === n ? null : n; touch(); render() }
      function kind(aid, k) { const a = l.areas.find((x) => x.id === aid); a.clue.kind = k; document.getElementById('hint-' + aid).innerHTML = hintFields(a, k) }
      const num = (v) => { if (!v.trim()) return null; const n = Number(v.replace(',', '.')); if (!Number.isFinite(n)) throw new Error('Enter a number'); return n }
      function saveArea(aid) {
        const a = l.areas.find((x) => x.id === aid), g = (k) => document.getElementById(`f-${k}-${aid}`)
        const st = document.getElementById('status-' + aid)
        try {
          a.name = g('name').value.trim() || null; a.priceEur = num(g('price').value); a.areaAres = num(g('area').value); a.purpose = g('purpose').value.trim() || null; a.notes = g('notes').value.trim() || null
          a.clue.kind = g('kind').value
          if (a.clue.kind === 'parcel') a.clue.parcel = g('parcel').value.trim()
          if (a.clue.kind === 'coordinates') { a.clue.lat = num(g('lat').value); a.clue.lng = num(g('lng').value); a.clue.precision = g('prec').value }
          if (a.clue.kind === 'address') a.clue.address = g('addr').value.trim()
          touch(); st.textContent = 'Saved'; st.style.color = 'var(--pass)'; setTimeout(render, 700)
        } catch (e) { st.textContent = e.message + ' — check price and area'; st.style.color = 'var(--fail)' }
      }
      function retryLocation(aid) { P.toast('Looking up the location… (prototype)') }
      function runChecks(aid) { P.toast('Running the 13 checks… (prototype)') }
      function visited() { l.visitedAt = Date.now(); const i = S.plan.indexOf(l.id); if (i >= 0) S.plan.splice(i, 1); touch(); location.href = 'trip.html' }
      function remove() { if (!confirm(`Remove "${l.title}" and its marked areas from the search? Saving the same advert again can bring it back.`)) return; S.listings.splice(S.listings.indexOf(l), 1); const i = S.plan.indexOf(l.id); if (i >= 0) S.plan.splice(i, 1); P.save(); location.href = 'plots.html' }
      P.mount('plot')
      render()
    </script>
  </body>
</html>
