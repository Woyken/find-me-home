name: Refresh Registered Parcel assets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        run: pnpm deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live Worker boundary
        run: pnpm smoke:worker "$VITE_WORKER_URL" "https://woyken.github.io"
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

  build-and-deploy:
    needs: deploy-worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Build production Pages artifact
        run: pnpm build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - name: Verify production Worker configuration
        run: pnpm verify:worker-build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
      - run: pnpm generate:parcels
      - run: pnpm validate:parcels
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
