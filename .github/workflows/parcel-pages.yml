name: Refresh Registered Parcel assets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      e2e-pages:
        description: Deploy an E2E-enabled Pages artifact without touching the Worker
        required: false
        type: boolean
        default: false
      pages-only:
        description: Deploy Pages without touching the Worker
        required: false
        type: boolean
        default: false
      checkout-ref:
        description: Ref to build for a controlled Pages-only restore
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-worker:
    if: inputs.e2e-pages != true && inputs.pages-only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        run: pnpm deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live Worker boundary
        run: pnpm smoke:worker "$VITE_WORKER_URL" "https://woyken.github.io"
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}

  build-and-deploy:
    needs: [deploy-worker]
    if: always() && (inputs.e2e-pages == true || inputs.pages-only == true || needs.deploy-worker.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - name: Install browser for E2E Pages readiness
        if: inputs.e2e-pages == true
        run: pnpm exec playwright install --with-deps chromium
      - name: Refresh Registered Parcel assets
        if: github.event_name != 'push' && inputs.e2e-pages != true && inputs.pages-only != true
        run: pnpm generate:parcels public/parcels
      - name: Validate Registered Parcel assets
        run: pnpm validate:parcels public/parcels
      - name: Build production Pages artifact
        if: inputs.e2e-pages != true
        run: pnpm build
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
      - name: Build E2E Pages artifact
        if: inputs.e2e-pages == true
        run: pnpm build:e2e:pages
        env:
          VITE_E2E_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify production Worker configuration
        if: inputs.e2e-pages != true
        run: pnpm verify:worker-build dist/client
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test live Pages application
        if: inputs.e2e-pages != true
        run: pnpm smoke:pages "${{ steps.deployment.outputs.page_url }}" "$VITE_WORKER_URL"
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
      - name: Verify live E2E Pages readiness
        if: inputs.e2e-pages == true
        run: pnpm smoke:pages:e2e "${{ steps.deployment.outputs.page_url }}"
