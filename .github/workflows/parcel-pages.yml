name: Refresh Registered Parcel assets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        run: pnpm deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live Worker boundary
        run: pnpm smoke:worker "$VITE_WORKER_URL" "https://woyken.github.io"
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}

  build-and-deploy:
    needs: deploy-worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - name: Refresh Registered Parcel assets
        if: github.event_name != 'push'
        run: pnpm generate:parcels public/parcels
      - name: Validate Registered Parcel assets
        run: pnpm validate:parcels public/parcels
      - name: Build production Pages artifact
        run: pnpm build
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
      - name: Verify production Worker configuration
        run: pnpm verify:worker-build dist/client
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/client
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Smoke-test live Pages application
        run: pnpm smoke:pages "${{ steps.deployment.outputs.page_url }}" "$VITE_WORKER_URL"
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
