name: Refresh Registered Parcel assets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        run: pnpm deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live Worker boundary
        run: pnpm smoke:worker "$VITE_WORKER_URL" "https://woyken.github.io"
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}

  build-and-deploy:
    needs: deploy-worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check
      - name: Refresh Registered Parcel assets
        if: github.event_name != 'push'
        run: pnpm generate:parcels public/parcels
      - name: Validate Registered Parcel assets
        run: pnpm validate:parcels public/parcels
      - name: Build production Pages artifact
        run: pnpm build
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
      - name: Verify production Worker configuration
        run: pnpm verify:worker-build dist/client
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test live Pages application
        run: pnpm smoke:pages "${{ steps.deployment.outputs.page_url }}" "$VITE_WORKER_URL"
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
