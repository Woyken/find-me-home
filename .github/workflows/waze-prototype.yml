name: Probe unofficial Waze routing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waze-prototype
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://find-me-home-waze-prototype.karolis-uzkuraitis.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy isolated temporary Worker
        run: pnpm exec wrangler deploy --config wrangler.waze-prototype.jsonc
      - name: Probe Waze from Cloudflare
        run: |
          status=$(curl --silent --show-error --output waze-result.json --write-out '%{http_code}' \
            "$WORKER_URL/?latitude=54.7&longitude=25.3&at=0")
          cat waze-result.json
          printf '\nWorker HTTP status: %s\n' "$status"
          test "$status" = 200
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waze-prototype-result
          path: waze-result.json
          if-no-files-found: ignore
      - name: Remove temporary Worker
        if: always()
        run: |
          curl --fail-with-body --show-error --silent --request DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/find-me-home-waze-prototype" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
